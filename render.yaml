services:
  - type: web
    name: vocoalabs
    runtime: node
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_NHOST_SUBDOMAIN
        value: local
      - key: NEXT_PUBLIC_NHOST_REGION
        value: local
      - key: NEXT_PUBLIC_GRAPHQL_URL
        value: https://local.graphql.local.nhost.run/v1/graphql
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
